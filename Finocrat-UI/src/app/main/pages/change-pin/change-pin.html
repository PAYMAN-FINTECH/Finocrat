<div class="change-pin-container">
  <div class="change-pin-card">
    
    <div class="header">
      <h2>🔐 Change PIN</h2>
      <p>Update your 4-digit security PIN</p>
    </div>

    <div class="form-group">
      <label>Current PIN</label>
      <div class="password-wrapper">
        <input 
          [type]="showOldPin ? 'text' : 'password'"
          [(ngModel)]="oldPin"
          maxlength="4"
          placeholder="Enter current PIN"
          inputmode="numeric"
          pattern="\d*"
        >
        <button type="button" class="toggle-btn" (click)="toggleOldPin()">
          {{ showOldPin ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>New PIN</label>
      <div class="password-wrapper">
        <input 
          [type]="showNewPin ? 'text' : 'password'"
          [(ngModel)]="newPin"
          maxlength="4"
          placeholder="Enter new PIN"
          inputmode="numeric"
          pattern="\d*"
        >
        <button type="button" class="toggle-btn" (click)="toggleNewPin()">
          {{ showNewPin ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>

    <div class="form-group">
      <label>Confirm New PIN</label>
      <div class="password-wrapper">
        <input 
          [type]="showConfirmPin ? 'text' : 'password'"
          [(ngModel)]="confirmPin"
          maxlength="4"
          placeholder="Confirm new PIN"
          inputmode="numeric"
          pattern="\d*"
        >
        <button type="button" class="toggle-btn" (click)="toggleConfirmPin()">
          {{ showConfirmPin ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>

    <div class="error-message" *ngIf="error">
      ⚠️ {{ error }}
    </div>

    <div class="button-group">
      <button class="btn-primary" (click)="changePin()" [disabled]="isLoading">
        {{ isLoading ? 'Updating...' : 'Update PIN' }}
      </button>
      <button class="btn-secondary" (click)="cancel()">
        Cancel
      </button>
    </div>

    <div class="pin-hint">
      <small>PIN must be a 4-digit number</small>
    </div>

  </div>
</div>
