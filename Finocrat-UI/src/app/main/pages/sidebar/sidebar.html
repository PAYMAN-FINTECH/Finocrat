<div class="sidebar-container" [class.collapsed]="isCollapsed">
  
  <div class="sidebar-header">
    <div class="logo" (click)="toggleSidebar(); onLinkClick()">
      <div class="logo-icon">F</div>
      <span class="logo-text">Finocrat</span>
    </div>
    <button class="collapse-btn" (click)="toggleSidebar()">
      <svg *ngIf="!isCollapsed" width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2"/>
      </svg>
      <svg *ngIf="isCollapsed" width="20" height="20" viewBox="0 0 24 24" fill="none">
        <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2"/>
      </svg>
    </button>
  </div>

  <ul class="menu">
    <!-- DASHBOARD - Add click handler -->
    <li routerLink="/app/finhome" routerLinkActive="active" (click)="onLinkClick()">
      <div class="menu-left">
        <lucide-icon [img]="LayoutDashboard"></lucide-icon>
        <span class="menu-text">Dashboard</span>
      </div>
    </li>

    <!-- WALLET - Add click handler -->
    <li routerLink="/app/wallet" routerLinkActive="active" (click)="onLinkClick()">
      <div class="menu-left">
        <lucide-icon [img]="Wallet"></lucide-icon>
        <span class="menu-text">Wallet</span>
      </div>
    </li>

    <!-- BILL PAYMENTS - Add click handler -->
    <li routerLink="/app/cc" routerLinkActive="active" (click)="onLinkClick()">
      <div class="menu-left">
        <lucide-icon [img]="CreditCard"></lucide-icon>
        <span class="menu-text">Bill Payments</span>
      </div>
    </li>

    <!-- SERVICES - Add click handler -->
    <li routerLink="/app/services" routerLinkActive="active" (click)="onLinkClick()">
      <div class="menu-left">
        <lucide-icon [img]="Layers"></lucide-icon>
        <span class="menu-text">Services</span>
      </div>
    </li>

    <!-- REPORTS -->
    <li (click)="toggleReports()" class="parent">
      <div class="menu-left">
        <lucide-icon [img]="BarChart3"></lucide-icon>
        <span class="menu-text">Reports</span>
      </div>
      <span class="arrow" [class.rotate]="reportsOpen" *ngIf="!isCollapsed">▾</span>
    </li>

    <ul *ngIf="reportsOpen && !isCollapsed" class="submenu">
      <li routerLink="/app/payin-history" routerLinkActive="active" (click)="onLinkClick()">
        <lucide-icon [img]="ArrowDownCircle"></lucide-icon>
        <span>PayIn</span>
      </li>
      <li routerLink="/app/payout-history" routerLinkActive="active" (click)="onLinkClick()">
        <lucide-icon [img]="ArrowUpCircle"></lucide-icon>
        <span>PayOut</span>
      </li>
    </ul>

   <!-- ADMIN -->
<ng-container *ngIf="isAdmin">
  <li (click)="toggleAdmin()" class="parent">
    <div class="menu-left">
      <lucide-icon [img]="Shield"></lucide-icon>
      <span class="menu-text">Admin</span>
    </div>
    <span class="arrow" [class.rotate]="adminOpen" *ngIf="!isCollapsed">▾</span>
  </li>

  <ul *ngIf="adminOpen && !isCollapsed" class="submenu">

    <!-- USER LOOKUP -->
    <li routerLink="/app/admin-user-lookup" routerLinkActive="active" (click)="onLinkClick()">
      <lucide-icon [img]="Search"></lucide-icon>
      <span>Admin User Lookup</span>
    </li>

    <!-- USERS -->
    <li routerLink="/app/users" routerLinkActive="active" (click)="onLinkClick()">
      <lucide-icon [img]="Users"></lucide-icon>
      <span>Users</span>
    </li>

    <!-- KYC -->
    <!-- <li routerLink="/app/kyc" routerLinkActive="active" (click)="onLinkClick()">
      <lucide-icon [img]="BadgeCheck"></lucide-icon>
      <span>KYC</span>
    </li> -->

    <!-- DASHBOARD -->
    <li routerLink="/app/admin-dash" routerLinkActive="active" (click)="onLinkClick()">
      <lucide-icon [img]="BarChart3"></lucide-icon>
      <span>Admin Dashboard</span>
    </li>

    <!-- PASSBOOK -->
    <li routerLink="/app/passbook" routerLinkActive="active" (click)="onLinkClick()">
      <lucide-icon [img]="BookText"></lucide-icon>
      <span>Passbook</span>
    </li>

    <!-- FAILED -->
    <li routerLink="/app/failed" routerLinkActive="active" (click)="onLinkClick()">
      <lucide-icon [img]="AlertCircle"></lucide-icon>
      <span>Failed Amount</span>
    </li>

  </ul>
</ng-container>

    <!-- PROFILE - Add click handler -->
    <li routerLink="/app/profile" routerLinkActive="active" (click)="onLinkClick()">
      <div class="menu-left">
        <lucide-icon [img]="User"></lucide-icon>
        <span class="menu-text">Profile</span>
      </div>
    </li>

  </ul>

  <!-- FOOTER -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <lucide-icon [img]="LogOut"></lucide-icon>
      <span class="menu-text">Logout</span>
    </button>
  </div>

</div>
