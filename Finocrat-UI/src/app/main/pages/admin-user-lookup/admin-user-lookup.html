<div class="lookup-card">

  <!-- HEADER -->
  <div class="header">
    <h2>Admin + User Configuration</h2>

    <button class="btn primary"
            (click)="save()"
            [disabled]="loading || !selectedUserPhone">
      Save
    </button>
  </div>

  <!-- USER SELECT -->
  <div class="user-select">
    <label>Select User</label>

    <select [(ngModel)]="selectedUserPhone"
            (change)="onUserChange()">

      <option value="">-- Select User --</option>

      <option *ngFor="let u of users" [value]="u.userPhone">
        {{ u.name }} ({{ u.userPhone }})
      </option>

    </select>
  </div>

  <!-- LOADER -->
  <div *ngIf="loading" class="loader">Loading...</div>

  <!-- SETTINGS -->
  <div *ngIf="!loading && selectedUserPhone">

    <div class="setting-row" *ngFor="let key of keys">

      <label>{{ key }}</label>

      <div class="setting-control">
        <div *ngIf="isBoolean(settings[key]); else inputBlock">
          <label class="switch">
            <input type="checkbox" [(ngModel)]="settings[key]">
            <span class="slider"></span>
          </label>
        </div>

        <ng-template #inputBlock>
          <input type="text" [(ngModel)]="settings[key]" />
        </ng-template>

        <button type="button" class="icon-btn danger" title="Delete setting"
                aria-label="Delete setting"
                (click)="deleteSetting(key)">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
          </svg>
        </button>
      </div>

    </div>

    <!-- ADD -->
    <button class="btn secondary" (click)="toggleAdd()">
      + Add Setting
    </button>

    <div *ngIf="showAddSection" class="add-section">
      <input [(ngModel)]="newKey" placeholder="Key" />

      <select [(ngModel)]="newValueType">
        <option value="string">String</option>
        <option value="number">Number</option>
        <option value="boolean">Boolean</option>
      </select>

      <input *ngIf="newValueType !== 'boolean'" [(ngModel)]="newValue" />

      <select *ngIf="newValueType === 'boolean'" [(ngModel)]="newValue">
        <option [ngValue]="true">True</option>
        <option [ngValue]="false">False</option>
      </select>

      <button class="btn primary" (click)="addSetting()">Add</button>
    </div>

    <!-- SUCCESS -->
    <div *ngIf="message" class="toast">
      ✔ {{ message }}
    </div>

  </div>

</div>
