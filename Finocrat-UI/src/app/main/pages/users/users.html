<div class="dashboard-container">

  <div class="dashboard-header">
    <h2>User Management</h2>
    <button class="primary-btn" (click)="openAdd()">+ Add User</button>
  </div>

  <div class="card">
    <div class="table-wrapper">
      <table class="user-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>User Type</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let user of users">
          <td>{{user.userName}}</td>
          <td>{{user.email}}</td>
          <td>{{user.userPhone}}</td>
          <td>{{user.userTypeName}}</td>
          <td>
            <span class="status"
              [ngClass]="user.isActive ? 'active' : 'inactive'">
              {{user.isActive ? 'Active' : 'Inactive'}}
            </span>
          </td>
          <td>
            <button class="edit-btn" (click)="openEdit(user)">
              Edit
            </button>
          </td>
        </tr>
      </tbody>
      </table>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" *ngIf="showModal">

    <div class="modal-box">

      <div class="modal-header">
        <h3>{{editMode ? 'Edit User' : 'Add User'}}</h3>
        <span class="close-btn" (click)="showModal=false">✖</span>
      </div>

      <form [formGroup]="form" (ngSubmit)="save()" class="form-grid">

        <div class="form-group">
          <label>User Name</label>
          <input type="text" formControlName="userName">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password">
        </div>

        <div class="form-group">
          <label>Phone</label>
          <input type="text" formControlName="userPhone">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" formControlName="email">
        </div>

        <!-- NEW: User Type Dropdown -->
        <div class="form-group">
          <label>User Type</label>
          <select formControlName="userTypeId">
            <option value="">-- Select --</option>
            <option *ngFor="let type of userTypes" [value]="type.id">
              {{ type.name }}
            </option>
          </select>
          <div *ngIf="form.get('userTypeId')?.invalid && form.get('userTypeId')?.touched" class="error">
            User Type is required.
          </div>
        </div>

        <div class="checkbox-group">
          <label>
            <input type="checkbox" formControlName="isActive">
            Active
          </label>
        </div>

        <!-- <div class="checkbox-group">
          <label>
            <input type="checkbox" formControlName="isAdmin">
            Admin
          </label>
        </div> -->

        <div class="form-actions">
          <button type="button" class="cancel-btn"
                  (click)="showModal=false">
            Cancel
          </button>

          <button type="submit" class="primary-btn">
            {{editMode ? 'Update' : 'Save'}}
          </button>
        </div>

      </form>

    </div>
  </div>

</div>
