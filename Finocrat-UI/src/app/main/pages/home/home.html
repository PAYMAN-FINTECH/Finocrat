<div class="dashboard-container">

  <div class="dashboard-header">
    <h2>Dashboard</h2>

    <div class="filter-bar">
      <select [(ngModel)]="filterType" (change)="onFilterTypeChange()">
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="week">Last 7 Days</option>
        <option value="month">This Month</option>
        <option value="custom">Custom Range</option>
      </select>

      <input *ngIf="filterType === 'custom'" type="date" [(ngModel)]="fromDate" />
      <input *ngIf="filterType === 'custom'" type="date" [(ngModel)]="toDate" />

      <button (click)="applyFilter()">Apply</button>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card primary">
      <span>Total Transaction Count</span>
      <h3>{{ stats.totalCount }}</h3>
    </div>

    <div class="stat-card">
      <span>Total Order Amount</span>
      <h3>₹ {{ stats.totalAmount }}</h3>
    </div>

    <div class="stat-card success">
      <span>Total Success Count</span>
      <h3>{{ stats.successCount }}</h3>
    </div>

    <div class="stat-card danger">
      <span>Total Failed Count</span>
      <h3>{{ stats.failedCount }}</h3>
    </div>
  </div>

</div>
