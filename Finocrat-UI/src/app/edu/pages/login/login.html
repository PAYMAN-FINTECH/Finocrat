<div class="auth-container">
  <div class="auth-card">

    <div class="success-alert" *ngIf="showSignupSuccess">
      🎉 Account created successfully. Please login.
    </div>

    <h2>Welcome Back</h2>
    <p>Login to continue learning</p>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">

      <!-- Email -->
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" />

        <small *ngIf="submitted && f['email']?.errors?.['required']">
          Email is required
        </small>
        <small *ngIf="submitted && f['email']?.errors?.['email']">
          Enter a valid email
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" />

        <small *ngIf="submitted && f['password']?.errors?.['required']">
          Password is required
        </small>
      </div>

      <button class="btn-primary" type="submit">Login</button>
    </form>

    <p class="switch-text">
      Don’t have an account?
      <a routerLink="/signup">Sign up</a>
    </p>
  </div>
</div>
