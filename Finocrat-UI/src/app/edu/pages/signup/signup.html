<div class="auth-container">
  <div class="auth-card">

    <h2>Create your account</h2>
    <p class="subtitle">Start learning with Finocrat Edu</p>

    <form [formGroup]="signupForm" (ngSubmit)="onSignup()">

      <!-- Name -->
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="name" />

        <small *ngIf="submitted && f['name']?.errors?.['required']">
          Name is required
        </small>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" />

        <small *ngIf="submitted && f['email']?.errors?.['required']">
          Email is required
        </small>
        <small *ngIf="submitted && f['email']?.errors?.['email']">
          Enter a valid email
        </small>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" />

        <small *ngIf="submitted && f['password']?.errors?.['required']">
          Password is required
        </small>
      </div>

      <button class="btn-primary" type="submit">
        Create Account
      </button>
    </form>

    <p class="switch-text">
      Already have an account?
      <a routerLink="/login">Login</a>
    </p>

  </div>
</div>
