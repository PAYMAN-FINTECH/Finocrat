<div [class.app-blur]="showGlobalPin" class="app-container">

  <edu-header *ngIf="isEdu"></edu-header>

  <app-mainheader *ngIf="!isEdu"></app-mainheader>

  <router-outlet></router-outlet>

  <edu-footer *ngIf="isEdu"></edu-footer>

  <app-mainfooter *ngIf="!isEdu && !showFooter"></app-mainfooter>

  <app-loader></app-loader>

</div>

<app-pin-verification
  *ngIf="showGlobalPin"
  (success)="unlockApp()">
</app-pin-verification>
